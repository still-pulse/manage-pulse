[project]
name = "managepulse"
authors = [
	{ name = "Still Pulse", email = "dev@stillpulse.com.br" }
]
description = "Pesquisas de satisfação multi-unidade (paciente, acompanhante e visitante) — BHCL / ManagePulse"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
# frappe é instalado e gerenciado pelo bench — não declarar aqui.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
	"B017",
	"B018",
	"B023",
	"B904",
	"E101",
	"E402",
	"E501",
	"E741",
	"F401",
	"F403",
	"F405",
	"F722",
	"W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
